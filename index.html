<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>kusa</title>
<meta name="description" content="草の図鑑・合成ゲーム">
<meta name="theme-color" content="#3a2e1c">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="kusa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="field" aria-hidden="true"></div>
<div id="app">
  <header id="topbar">
    <h1 class="plate title"><span class="sr">kusa</span></h1>
    <button type="button" id="btnBook" class="plate chip-book" aria-label="図鑑を開く">
      <span class="plate-num"><span id="bookCount">0/0</span><small>種</small></span>
      <span class="meter" aria-hidden="true"><i id="bookMeter"></i></span>
    </button>
    <span class="plate chip-coin" role="img" aria-label="コイン"><span class="plate-num"><span id="coins">0</span></span></span>
  </header>

  <main id="stage">
    <div id="board" role="grid" aria-label="牧場"></div>
    <div id="plants"></div>
    <div id="air" aria-hidden="true"></div>
    <p id="message" class="message" aria-live="polite">種をまいて、同じ草を重ねてみよう。</p>
  </main>

  <footer id="actions">
    <button type="button" id="btnSell" class="btn btn-sell"><span class="sr">売る (選択した草を売却)</span></button>
    <button type="button" id="btnPlant" class="btn btn-primary"><span class="sr">種をまく (新しい草を育てる)</span></button>
  </footer>
</div>

<!-- 発見の演出 -->
<div id="discover" class="discover" hidden>
  <div class="discover-card">
    <p class="discover-kicker" id="discoverKicker">発見！</p>
    <div class="discover-art" id="discoverArt"></div>
    <p class="discover-no" id="discoverNo"></p>
    <h2 class="discover-name" id="discoverName"></h2>
    <p class="rarity" id="discoverRarity"></p>
    <p class="discover-note">図鑑に登録しました</p>
    <p class="discover-unlock" id="discoverUnlock" hidden></p>
  </div>
</div>

<!-- 図鑑 -->
<section id="book" class="sheet" hidden aria-label="植物図鑑">
  <header class="sheet-head">
    <h2>植物図鑑</h2>
    <span class="count-badge" id="bookCount2"></span>
    <button type="button" id="btnBookClose" class="btn-close" aria-label="閉じる">×</button>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" class="tab on" data-group="lineage" role="tab">系統別</button>
    <button type="button" class="tab" data-group="rarity" role="tab">レア度別</button>
  </div>
  <div id="bookList" class="book-list"></div>
  <p class="version" id="version"></p>
</section>

<!-- 図鑑の拡大表示 -->
<div id="zoom" class="zoom" hidden>
  <div class="zoom-card">
    <button type="button" id="btnZoomClose" class="btn-close" aria-label="閉じる">×</button>
    <div class="zoom-art" id="zoomArt"></div>
    <p class="discover-no" id="zoomNo"></p>
    <h2 class="discover-name" id="zoomName"></h2>
    <p class="rarity" id="zoomRarity"></p>
    <p class="zoom-note" id="zoomNote"></p>
    <p class="zoom-recipe" id="zoomRecipe"></p>
  </div>
</div>

<script src="./core.js"></script>
<script src="./looks.js"></script>
<script src="./plants.js"></script>
<script src="./app.js"></script>
</body>
</html>

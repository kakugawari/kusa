<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kusa</title>
<meta name="description" content="草の図鑑・合成ゲーム">
<meta name="theme-color" content="#e9eedb">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<canvas id="backdrop" aria-hidden="true"></canvas>
<div id="app">
  <header id="topbar">
    <h1 class="title">
      <svg class="logo-sprout" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-8.5" /><path d="M12 13c-.6-3.8-3.6-6-7.6-5.8.2 4 2.9 6.2 7.6 5.8z" /><path d="M12 11.2c.4-3.4 3-5.6 7-5.6-.1 3.6-2.6 5.8-7 5.6z" /></svg>
      <span class="title-word">kusa</span>
    </h1>
    <button type="button" id="btnBook" class="chip chip-book" aria-label="図鑑を開く">
      <svg class="chip-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h10.5a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z" /><path d="M5 17a3 3 0 0 1 3-3h10.5" /><path d="M10.5 11.5c0-2.2 1.4-3.6 3.6-3.8 0 2.2-1.4 3.7-3.6 3.8z" /></svg>
      <span class="chip-text"><span id="bookCount">0 / 0</span><span class="chip-unit">種</span></span>
      <span class="meter" aria-hidden="true"><i id="bookMeter"></i></span>
    </button>
    <span class="chip chip-coin" aria-label="コイン"><span class="coin-dot" aria-hidden="true"></span><span id="coins">0</span></span>
  </header>

  <main id="stage">
    <div id="diorama">
      <div id="slab">
        <canvas id="soil" width="760" height="1360" aria-hidden="true"></canvas>
        <div id="board" role="grid" aria-label="牧場"></div>
        <div class="slab-front" aria-hidden="true"><canvas id="strata" width="760" height="220"></canvas></div>
      </div>
    </div>
    <div id="plants"></div>
    <div id="air" aria-hidden="true"></div>
    <p id="message" class="message" aria-live="polite">種をまいて、同じ草を重ねてみよう。</p>
  </main>

  <footer id="actions">
    <button type="button" id="btnSell" class="btn btn-sell">
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h16l-1.6 8.4a2 2 0 0 1-2 1.6H7.6a2 2 0 0 1-2-1.6z" /><path d="M8.5 10 11 4.5M15.5 10 13 4.5" /><path d="M9.5 14v2.5M14.5 14v2.5" /></svg>
      <span>売る</span>
    </button>
    <button type="button" id="btnPlant" class="btn btn-primary">
      <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5v-7" /><path d="M12 13.5c-.4-3.4-2.9-5.4-6.4-5.3.1 3.5 2.5 5.4 6.4 5.3z" /><path d="M12 12c.3-3 2.6-4.9 6-4.9-.1 3.1-2.3 5-6 4.9z" /><path d="M7.5 20.5h9" /></svg>
      <span>種をまく</span>
    </button>
  </footer>
</div>

<!-- 発見の演出 -->
<div id="discover" class="discover" hidden>
  <div class="discover-card">
    <p class="discover-kicker" id="discoverKicker">発見！</p>
    <div class="discover-art" id="discoverArt"></div>
    <p class="discover-no" id="discoverNo"></p>
    <h2 class="discover-name" id="discoverName"></h2>
    <p class="rarity" id="discoverRarity"></p>
    <p class="discover-note">図鑑に登録しました</p>
  </div>
</div>

<!-- 図鑑 -->
<section id="book" class="sheet" hidden aria-label="植物図鑑">
  <header class="sheet-head">
    <h2>植物図鑑</h2>
    <span class="count-badge" id="bookCount2"></span>
    <button type="button" id="btnBookClose" class="btn-close" aria-label="閉じる">×</button>
  </header>
  <div class="tabs" role="tablist">
    <button type="button" class="tab on" data-group="lineage" role="tab">系統別</button>
    <button type="button" class="tab" data-group="rarity" role="tab">レア度別</button>
  </div>
  <div id="bookList" class="book-list"></div>
</section>

<!-- 図鑑の拡大表示 -->
<div id="zoom" class="zoom" hidden>
  <div class="zoom-card">
    <button type="button" id="btnZoomClose" class="btn-close" aria-label="閉じる">×</button>
    <div class="zoom-art" id="zoomArt"></div>
    <p class="discover-no" id="zoomNo"></p>
    <h2 class="discover-name" id="zoomName"></h2>
    <p class="rarity" id="zoomRarity"></p>
    <p class="zoom-note" id="zoomNote"></p>
    <p class="zoom-recipe" id="zoomRecipe"></p>
  </div>
</div>

<script src="./core.js"></script>
<script src="./looks.js"></script>
<script src="./plants.js"></script>
<script src="./app.js"></script>
</body>
</html>
